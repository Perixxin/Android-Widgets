      - name: Fetch Inter
        continue-on-error: true
        run: |
          set -e
          mkdir -p app/src/main/res/font fontwork
          # Inter is SIL Open Font Licensed, so it can ship inside the APK.
          # SF Pro cannot: Apple licenses it for Apple platforms only.
          URL=$(curl -sL https://api.github.com/repos/rsms/inter/releases/latest \
            | grep -o 'https://[^"]*Inter[^"]*\.zip' | head -1)
          echo "Inter release: $URL"
          curl -sL "$URL" -o fontwork/inter.zip
          unzip -q -o fontwork/inter.zip -d fontwork/inter
          copyface () {
            SRC=$(find fontwork/inter -iname "$1" | head -1)
            if [ -n "$SRC" ]; then cp "$SRC" "app/src/main/res/font/$2"; echo "  $2 <- $SRC"; fi
          }
          copyface 'Inter-Regular.ttf'  inter_regular.ttf
          copyface 'Inter-Medium.ttf'   inter_medium.ttf
          copyface 'Inter-SemiBold.ttf' inter_semibold.ttf
          copyface 'Inter-Bold.ttf'     inter_bold.ttf
          ls -la app/src/main/res/font/

      - name: Fall back to the system face if Inter is unavailable
        run: |
          NEEDED="inter_regular inter_medium inter_semibold inter_bold"
          MISSING=0
          for f in $NEEDED; do
            [ -f "app/src/main/res/font/$f.ttf" ] || MISSING=1
          done
          if [ "$MISSING" = "1" ]; then
            echo "::warning::Inter not available, falling back to the system sans face"
            rm -f app/src/main/res/font/*.ttf
            cat > app/src/main/res/values/styles.xml <<'STYLES'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <style name="GdText">
                    <item name="android:fontFamily">sans-serif</item>
                    <item name="android:includeFontPadding">false</item>
                </style>
                <style name="GdMedium" parent="GdText">
                    <item name="android:fontFamily">sans-serif-medium</item>
                </style>
                <style name="GdSemibold" parent="GdText">
                    <item name="android:fontFamily">sans-serif-medium</item>
                </style>
                <style name="GdBold" parent="GdText">
                    <item name="android:fontFamily">sans-serif</item>
                    <item name="android:textStyle">bold</item>
                </style>
                <style name="GdConfig" parent="@android:style/Theme.Material.NoActionBar">
                    <item name="android:colorAccent">#0A84FF</item>
                </style>
                <style name="GdSheet" parent="@android:style/Theme.Material.Dialog.NoActionBar">
                    <item name="android:colorAccent">#0A84FF</item>
                    <item name="android:windowIsFloating">true</item>
                </style>
            </resources>
          STYLES
          fi

      - name: Install SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage the APK
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "Built: $APK"
          mkdir -p out
          cp "$APK" "out/GlassDeck-v1.0.${{ github.run_number }}.apk"
          ls -la out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassDeck-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --title "Glass Deck v1.0.${{ github.run_number }}" \
            --notes "Ten Liquid Glass widgets for the Galaxy Z Fold 8. Tap the .apk below to install. Turn off Auto Blocker first: Settings > Security and privacy > Auto Blocker." \
            --repo "$GITHUB_REPOSITORY"
